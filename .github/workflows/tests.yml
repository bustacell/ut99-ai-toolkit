# Offline tests: no game, no OBS, no personal data (a throwaway config, synthetic moments and clips).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests (privacy check, planner, assembler, export)
        run: python -m unittest discover -s tests -v

      - name: PowerShell checks (every script parses, render-resume decisions)
        shell: pwsh
        run: ./tests/Test-PowerShell.ps1
