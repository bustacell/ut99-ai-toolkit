# Public edition only (copied in by tools/export_public.py): every push to main (= every export) publishes the whole
# repository as one ZIP release, for people who don't want to clone.
name: Release ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-zip
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build ZIP and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY#*/}"
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "HEAD is already released"; exit 0
          fi
          # version numbers: vMAJOR.MINOR.PATCH; the minor number goes up unless the export commit carries a
          # "Release-Bump: patch|major" trailer (tools/export_public.py --bump)
          prev=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          bump=$(git log -1 --format='%(trailers:key=Release-Bump,valueonly)' HEAD | tr -d '[:space:]')
          if [ -z "$prev" ]; then
            tag="v1.0.0"
          else
            IFS=. read -r ma mi pa <<< "${prev#v}"
            case "$bump" in
              major) tag="v$((ma + 1)).0.0" ;;
              patch) tag="v$ma.$mi.$((pa + 1))" ;;
              *)     tag="v$ma.$((mi + 1)).0" ;;
            esac
          fi
          zip="$name-$tag.zip"
          git archive --format=zip --prefix="$name/" -o "$zip" HEAD
          # release notes = body of the export commit (written by tools/export_public.py: what changed, in words)
          body=$(git log -1 --format=%b HEAD | sed -e '/^Co-Authored-By:/d' -e '/^Release-Bump:/d')
          {
            if [ -n "$body" ]; then
              printf '%s\n' "$body"
            else
              echo "Maintenance update."
            fi
            echo
            echo "### Download"
            echo
            echo "\`$zip\` below: unzip it anywhere (keep the path short, e.g. \`C:\\UTDD\`) and follow the README."
            echo "To get updates later, download the newest release or clone the repository."
            echo "No game content is included: you need your own copy of Unreal Tournament (1999) with the OldUnreal 469 patch."
            if [ -n "$prev" ]; then
              echo
              echo "<details><summary>Files changed since $prev</summary>"
              echo
              echo '```'
              git diff --stat=100,70 "$prev" HEAD | tail -n 60
              echo '```'
              echo "</details>"
            fi
          } > notes.md
          gh release create "$tag" "$zip" --title "UT99 AI Toolkit $tag" --notes-file notes.md \
            --target "$GITHUB_SHA" --latest
